<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outline — folding viewer for Obsidian notes</title>
<style>
  :root {
    --bg: #1c1c1f;
    --bg-elevated: #232327;
    --bg-hover: #2a2a2f;
    --text: #dcdce0;
    --text-muted: #8a8a92;
    --text-faint: #5c5c63;
    --accent: #9c8cff;
    --accent-dim: #6f5fd6;
    --accent-soft: rgba(156, 140, 255, 0.14);
    --border: #333338;
    --guide: #35353b;
    --code-bg: #29292e;
    --shadow: rgba(0, 0, 0, 0.35);
    --radius: 6px;
  }
  [data-theme="light"] {
    --bg: #faf9f7;
    --bg-elevated: #ffffff;
    --bg-hover: #f0eef0;
    --text: #201f26;
    --text-muted: #6c6a74;
    --text-faint: #a5a3ab;
    --accent: #6a4fd8;
    --accent-dim: #7d63e8;
    --accent-soft: rgba(106, 79, 216, 0.09);
    --border: #e6e3e0;
    --guide: #e2dfe6;
    --code-bg: #f1eef0;
    --shadow: rgba(30, 20, 50, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: 0.1px;
    color: var(--text);
    margin-right: auto;
    white-space: nowrap;
  }
  .brand svg { flex-shrink: 0; }
  .brand .filename {
    color: var(--text-muted);
    font-weight: 400;
    padding-left: 8px;
    border-left: 1px solid var(--border);
    max-width: 40vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  button.bar-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    padding: 6px 11px;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  button.bar-btn:hover { background: var(--bg-hover); border-color: var(--text-faint); }
  button.bar-btn:active { transform: translateY(1px); }
  button.icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 32px;
    height: 32px;
    border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button.icon-btn:hover { background: var(--bg-hover); color: var(--text); }

  input[type="file"] { display: none; }

  /* ---------- Layout ---------- */
  .stage {
    min-height: calc(100% - 57px);
    display: flex;
    flex-direction: column;
  }

  /* ---------- Drop zone ---------- */
  .dropzone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .dropzone-card {
    width: 100%;
    max-width: 480px;
    text-align: center;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 48px 32px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone-card.drag-over {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .dropzone-card h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  .dropzone-card p {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.55;
    margin: 0 0 22px;
  }
  .dropzone-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .dropzone-note {
    margin-top: 22px;
    font-size: 12.5px;
    color: var(--text-faint);
  }
  .dropzone-note button {
    background: none;
    border: none;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ---------- Outline content ---------- */
  .outline-wrap {
    flex: 1;
    padding: 44px 20px 120px;
  }
  .outline {
    max-width: 720px;
    margin: 0 auto;
  }
  .doc-title {
    font-size: 27px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  /* fold row shared styling */
  .fold-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    cursor: pointer;
    border-radius: 4px;
    padding: 1px 4px 1px 2px;
    margin-left: -4px;
  }
  .fold-row:hover { background: var(--bg-hover); }
  .no-toggle { cursor: default; }
  .no-toggle:hover { background: transparent; }

  .arrow {
    flex-shrink: 0;
    width: 16px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    transition: transform 0.15s ease;
    transform: rotate(90deg);
    margin-top: 1px;
  }
  .arrow svg { width: 9px; height: 9px; }
  .collapsed > .fold-row > .arrow,
  .collapsed > .fold-row > .callout-arrow { transform: rotate(0deg); }
  .arrow.spacer { visibility: hidden; }

  /* headings */
  .h-section { margin: 0; }
  .h-section + .h-section { margin-top: 2px; }
  .h-row h2, .h-row h3, .h-row h4, .h-row h5, .h-row h6 {
    margin: 0;
    font-weight: 600;
    line-height: 1.4;
  }
  .h-row { padding-top: 10px; padding-bottom: 4px; }
  h2.htext { font-size: 20px; margin-top: 4px; }
  h3.htext { font-size: 17px; }
  h4.htext { font-size: 15px; color: var(--text); }
  h5.htext, h6.htext { font-size: 13.5px; color: var(--text-muted); text-transform: none; }

  .h-children {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.16s ease;
    margin-left: 4px;
    padding-left: 15px;
    border-left: 1px solid var(--guide);
  }
  .h-children-inner { overflow: hidden; }
  .collapsed > .h-children { grid-template-rows: 0fr; }

  /* lists */
  ul.list-block, ol.list-block {
    margin: 2px 0 8px;
    padding-left: 0;
    list-style: none;
  }
  li.list-item { margin: 0; }
  .li-row { padding: 2px 4px 2px 2px; align-items: flex-start; }
  .bullet {
    flex-shrink: 0;
    width: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    font-size: 15px;
    line-height: 1.6;
  }
  .li-num {
    flex-shrink: 0;
    min-width: 18px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    line-height: 1.6;
  }
  .li-text { line-height: 1.6; font-size: 14.5px; padding-top: 1px; }
  .li-children {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.16s ease;
    margin-left: 8px;
    padding-left: 12px;
    border-left: 1px solid var(--guide);
  }
  .li-children-inner { overflow: hidden; }
  .collapsed > .li-children { grid-template-rows: 0fr; }

  /* paragraphs */
  p.text-block {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text);
    margin: 4px 0 10px;
  }

  /* code */
  pre.code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 6px 0 12px;
  }
  pre.code-block code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
  }

  /* callouts */
  .callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
    padding: 8px 14px;
    margin: 8px 0 14px;
  }
  .callout-title-row { padding: 2px 2px; }
  .callout-title {
    font-weight: 600;
    font-size: 14px;
    color: var(--accent);
  }
  .callout-icon { color: var(--accent); flex-shrink: 0; margin-top: 2px; }
  .callout-body { padding-left: 24px; margin-top: 4px; }
  .callout-body p.text-block:last-child { margin-bottom: 2px; }

  /* inline */
  code.inline-code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.9em;
  }
  mark.hl { background: var(--accent-soft); color: inherit; padding: 0 2px; border-radius: 3px; }
  .wikilink { color: var(--accent); }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-dim); }
  a:hover { opacity: 0.85; }

  /* textarea paste mode */
  .paste-panel {
    width: 100%;
    max-width: 640px;
    margin-top: 18px;
    text-align: left;
  }
  .paste-panel textarea {
    width: 100%;
    height: 160px;
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    resize: vertical;
  }

  .hidden { display: none !important; }

  /* ---------- File tabs ---------- */
  .file-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .file-tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    font-size: 13px;
    padding: 6px 9px;
    border-radius: var(--radius);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    flex-shrink: 0;
  }
  .file-tab:hover { background: var(--bg-hover); color: var(--text); }
  .file-tab.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent-dim);
  }
  .file-tab .tab-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 3px;
    opacity: 0.6;
    font-size: 10px;
  }
  .file-tab .tab-close:hover { opacity: 1; background: rgba(128,128,128,0.25); }

  /* ---------- Add-file panel ---------- */
  .add-panel {
    padding: 14px 18px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }
  .add-panel .dropzone-actions { justify-content: flex-start; }
  .add-panel .paste-panel { max-width: 640px; }

  /* ---------- Editor ---------- */
  .editor-wrap { flex: 1; padding: 24px 20px 60px; }
  .editor-inner { max-width: 780px; margin: 0 auto; }
  .editor-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }
  .editor-name-input {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    flex: 1;
    min-width: 140px;
    max-width: 320px;
  }
  textarea.editor-area {
    width: 100%;
    min-height: 60vh;
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.6;
    resize: vertical;
  }

  @media (max-width: 640px) {
    .outline-wrap { padding: 28px 14px 100px; }
    .editor-wrap { padding: 16px 14px 60px; }
  }
</style>
</head>
<body data-theme="dark">

  <div class="topbar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 L20 8 L17 21 L7 21 L4 8 Z" fill="currentColor" opacity="0.85"/></svg>
      Outline
    </div>
    <div class="file-tabs" id="fileTabs"></div>
    <button class="icon-btn" id="addFileBtn" title="Add another file">+</button>
    <button class="bar-btn" id="editBtn">Edit</button>
    <button class="bar-btn" id="expandAllBtn">Expand all</button>
    <button class="bar-btn" id="collapseAllBtn">Collapse all</button>
    <button class="icon-btn" id="themeToggle" title="Toggle light / dark">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>

  <div class="add-panel hidden" id="addPanel">
    <div class="dropzone-actions">
      <button class="bar-btn" id="browseBtn">Choose a file…</button>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt" />
      <button class="bar-btn" id="pasteToggle">Paste markdown instead</button>
    </div>
    <div class="paste-panel hidden" id="pastePanel">
      <input type="text" id="pasteNameInput" class="editor-name-input" style="max-width:100%; margin-bottom:8px;" placeholder="File name, e.g. Notes.md" />
      <textarea id="pasteArea" placeholder="# Heading&#10;- item&#10;  - sub item"></textarea>
      <div style="margin-top:10px;">
        <button class="bar-btn" id="pasteRenderBtn">Add file</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="outline-wrap" id="outlineWrap">
      <div class="outline" id="outline"></div>
    </div>

    <div class="editor-wrap hidden" id="editorWrap">
      <div class="editor-inner">
        <div class="editor-toolbar">
          <input type="text" id="editorNameInput" class="editor-name-input" />
          <button class="bar-btn" id="saveEditBtn">Save</button>
          <button class="bar-btn" id="cancelEditBtn">Cancel</button>
          <button class="bar-btn" id="downloadBtn">Download .md</button>
          <button class="bar-btn" id="resetDocBtn">Reset to original</button>
        </div>
        <textarea id="editorArea" class="editor-area" spellcheck="false"></textarea>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* These notes are baked into the page so it always opens straight to them —
     use the "+" button in the top bar to add more, or "Edit" to change one. */
  const DEFAULT_DOCS = [
    {
      name: "Mobile Barricade.md",
      content: "Initial:\n\tNormal Condition\nMotion (6-9Km/hr):\n\tBarricade Mode\nAbove 9 Km/Hr:\n\tKey Points:\n\t\tA - Near the bottom\n\t\tB - Top left corner\n\t\tC - Top right corner\n\t\tPower Switch\n\tTwo Hand Authentication:\n\t\tPress A and Power Switch Simultaneously\n\tProceed Further:\n\t\tAny Combination of A,B,C\n\t\tExample: A+B or B+C or C+A , etc.\n\tMake Call / Take Call:\n\t\tPress any two mode marks from (A, B, and C)\n\tKeep Screen Active:(Wake Up Action)\n\t\tWhile one finger on one of the three mode marks (A, B, or C), operate the mobile with another hand:\n\t\t\tIf in call(the moment when the phone touches the ear and the screen goes black):\n\t\t\t\tOperate without position change until call ends\n\t\t\tElse:\n\t\t\t\tKeep interacting with the screen every 3 to 5 seconds\n\tIf mobile is not interacted with every 3 to 5 seconds:\n\t\tFriction:(Wake Up Action required to activate the screen)\n\tProlonged continuous interaction with the mobile:(Passenger Recognition)\n\t\tPassenger Mode:\n\t\t\tFriction reduces:\n\t\t\t\tMobile can be left without interacting for more than 3 to 5 seconds\n\t\t\tPeriodic Checks at random intervals to stay in passenger mode:\n\t\t\t\tPuzzle solving, Flash Cards, etc.\n\tPosition Change Trigger:\n\t\tIf mobile position changes while on call (without speaker or Bluetooth), Wake Up Action triggered\n",
    },
    {
      name: "Theft Control.md",
      content: "Call:\n\tIf not ringing:\n\t\t In Airplane mode/DND mode:\n\t\t\t Dialing secret code and mobile number will unlock silent mode\n\t\tBattery has been drained:\n\t\t\t5% reserve is always present\n\tContinuous ringing:\n\t\tStarts Alarming:\n\t\t\tAuthentication required to stop alarm\nAs long as mobile is switched on:\n\tSIM is present within the mobile:\n\t\tMobile can be tracked\nIf mobile is not switched off:\n\tSIM card cannot be removed\n\tAuthentication required to switch off the mobile phone",
    },
  ];

  /* ============================================================
     1. MARKDOWN / OUTLINE → TREE PARSER
     Handles two things people export from Obsidian:
     (a) standard markdown — headings, "- " / "1. " lists, callouts,
         fenced code, paragraphs
     (b) plain indentation outlines — lines with no bullet at all,
         where indentation alone (tabs or spaces) is what nests and
         folds them, exactly like Obsidian's own fold arrows do for
         any indented line, not just list items.
  ============================================================ */

  function parseMarkdown(source) {
    const lines = source.replace(/\r\n?/g, "\n").split("\n");
    const root = { type: "root", children: [] };
    const headingStack = [{ level: 0, node: root }];
    let itemStack = []; // { indent, node } — any indented line (list item or plain)

    function insertAtIndent(indent, node) {
      while (itemStack.length && itemStack[itemStack.length - 1].indent >= indent) {
        itemStack.pop();
      }
      if (itemStack.length) itemStack[itemStack.length - 1].node.children.push(node);
      else headingStack[headingStack.length - 1].node.children.push(node);
    }

    let i = 0;
    while (i < lines.length) {
      const raw = lines[i];

      if (raw.trim() === "") { i++; continue; }

      // fenced code block
      let m = raw.match(/^(\s*)```(.*)$/);
      if (m) {
        const indent = m[1].length;
        const lang = m[2].trim();
        const body = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { body.push(lines[i]); i++; }
        i++; // closing fence
        insertAtIndent(indent, { type: "code", lang, text: body.join("\n") });
        continue;
      }

      // heading
      m = raw.match(/^(#{1,6})\s+(.*)$/);
      if (m) {
        itemStack = [];
        const level = m[1].length;
        const text = m[2].replace(/\s+#+\s*$/, "").trim();
        while (headingStack.length > 1 && headingStack[headingStack.length - 1].level >= level) headingStack.pop();
        const node = { type: "heading", level, text, children: [] };
        headingStack[headingStack.length - 1].node.children.push(node);
        headingStack.push({ level, node });
        i++;
        continue;
      }

      // callout: > [!type]+/- Title
      m = raw.match(/^(\s*)>\s?\[!([\w-]+)\]([+-]?)\s*(.*)$/i);
      if (m) {
        const indent = m[1].length;
        const ctype = m[2].toLowerCase();
        const foldChar = m[3];
        const title = m[4].trim();
        const bodyLines = [];
        i++;
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          bodyLines.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        const inner = parseMarkdown(bodyLines.join("\n"));
        insertAtIndent(indent, {
          type: "callout",
          ctype,
          title: title || ctype.charAt(0).toUpperCase() + ctype.slice(1),
          foldable: foldChar !== "",
          collapsedByDefault: foldChar === "-",
          children: inner.children,
        });
        continue;
      }

      // list item: "- ", "* ", "+ ", "1. "
      m = raw.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if (m) {
        const indent = m[1].length;
        const ordered = /\d/.test(m[2]);
        const text = m[3];
        const node = { type: "item", marker: ordered ? "ordered" : "bullet", text, children: [] };
        insertAtIndent(indent, node);
        itemStack.push({ indent, node });
        i++;
        continue;
      }

      // plain indented line — no bullet, but indentation alone still nests
      // and folds it, matching Obsidian's own behavior for any indented line.
      const indent = (raw.match(/^(\s*)/) || ["", ""])[1].length;
      const node = { type: "item", marker: "none", text: raw.trim(), children: [] };
      insertAtIndent(indent, node);
      itemStack.push({ indent, node });
      i++;
    }

    return root;
  }

  /* ============================================================
     2. INLINE MARKDOWN (bold / italic / code / links / etc.)
  ============================================================ */

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderInline(text) {
    let s = escapeHtml(text);
    // inline code first, so we don't mangle its contents
    const codeStash = [];
    s = s.replace(/`([^`]+)`/g, (_, code) => {
      codeStash.push(code);
      return `\u0000${codeStash.length - 1}\u0000`;
    });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, '<span class="wikilink">🖼 $1</span>');
    s = s.replace(/\[\[([^\]|]+)(\|([^\]]+))?\]\]/g, (_, target, __, alias) => `<span class="wikilink">${alias || target}</span>`);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    s = s.replace(/==([^=]+)==/g, '<mark class="hl">$1</mark>');
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");
    s = s.replace(/\u0000(\d+)\u0000/g, (_, idx) => `<code class="inline-code">${escapeHtml(codeStash[+idx])}</code>`);
    return s;
  }

  /* ============================================================
     3. RENDER TREE → HTML
  ============================================================ */

  let uid = 0;
  const nextId = () => "n" + (uid++);

  function hasFoldableContent(children) {
    return children && children.length > 0;
  }

  function renderChildren(children) {
    let html = "";
    let i = 0;
    while (i < children.length) {
      const node = children[i];
      if (node.type === "item") {
        const marker = node.marker;
        const tag = marker === "ordered" ? "ol" : "ul";
        let items = "";
        let n = 1;
        while (i < children.length && children[i].type === "item" && children[i].marker === marker) {
          items += renderItem(children[i], marker === "ordered" ? n : null);
          n++;
          i++;
        }
        html += `<${tag} class="list-block">${items}</${tag}>`;
        continue;
      }
      html += renderNode(node);
      i++;
    }
    return html;
  }

  function renderItem(node, number) {
    const id = nextId();
    const foldable = hasFoldableContent(node.children);
    const arrow = foldable
      ? `<span class="arrow">${arrowSvg()}</span>`
      : `<span class="arrow spacer">${arrowSvg()}</span>`;
    const rowClass = "fold-row li-row" + (foldable ? "" : " no-toggle");
    let marker = "";
    if (number != null) marker = `<span class="li-num">${number}.</span>`;
    else if (node.marker === "bullet") marker = `<span class="bullet">•</span>`;
    // marker === "none" -> plain indented line, no visual bullet at all
    const childrenHtml = foldable
      ? `<div class="li-children"><div class="li-children-inner">${renderChildren(node.children)}</div></div>`
      : "";
    return `<li class="list-item" id="${id}">
        <div class="${rowClass}" ${foldable ? `onclick="toggleFold('${id}')"` : ""}>
          ${arrow}${marker}<span class="li-text">${renderInline(node.text)}</span>
        </div>
        ${childrenHtml}
      </li>`;
  }

  function arrowSvg() {
    return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  }

  function calloutIcon() {
    return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L3 14 h7 l-1 8 10-12 h-7 z"/></svg>`;
  }

  function renderNode(node) {
    switch (node.type) {
      case "heading": {
        const id = nextId();
        const foldable = hasFoldableContent(node.children);
        const arrow = foldable
          ? `<span class="arrow">${arrowSvg()}</span>`
          : `<span class="arrow spacer">${arrowSvg()}</span>`;
        const level = Math.min(node.level + 1, 6); // shift so H1 in md -> h2 visually (page title takes h1)
        const rowClass = "fold-row h-row" + (foldable ? "" : " no-toggle");
        const childrenHtml = foldable
          ? `<div class="h-children"><div class="h-children-inner">${renderChildren(node.children)}</div></div>`
          : "";
        return `<section class="h-section" id="${id}">
            <div class="${rowClass}" ${foldable ? `onclick="toggleFold('${id}')"` : ""}>
              ${arrow}<h${level} class="htext">${renderInline(node.text)}</h${level}>
            </div>
            ${childrenHtml}
          </section>`;
      }
      case "code":
        return `<pre class="code-block"><code>${escapeHtml(node.text)}</code></pre>`;
      case "callout": {
        const id = nextId();
        const foldable = node.foldable;
        const arrow = foldable
          ? `<span class="arrow callout-arrow">${arrowSvg()}</span>`
          : `<span class="arrow spacer">${arrowSvg()}</span>`;
        const rowClass = "fold-row callout-title-row" + (foldable ? "" : " no-toggle");
        const startCollapsed = node.collapsedByDefault ? " collapsed" : "";
        const body = `<div class="callout-body">${renderChildren(node.children)}</div>`;
        return `<div class="callout${startCollapsed}" id="${id}">
            <div class="${rowClass}" ${foldable ? `onclick="toggleFold('${id}')"` : ""}>
              ${arrow}<span class="callout-icon">${calloutIcon()}</span><span class="callout-title">${renderInline(node.title)}</span>
            </div>
            ${body}
          </div>`;
      }
      default:
        return "";
    }
  }

  window.toggleFold = function (id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("collapsed");
  };

  /* ============================================================
     4. WIRING — file loading, drag & drop, toolbar controls
  ============================================================ */

  const outlineWrap = document.getElementById("outlineWrap");
  const outlineEl = document.getElementById("outline");
  const editorWrap = document.getElementById("editorWrap");
  const editorArea = document.getElementById("editorArea");
  const editorNameInput = document.getElementById("editorNameInput");
  const fileTabs = document.getElementById("fileTabs");
  const fileInput = document.getElementById("fileInput");
  const browseBtn = document.getElementById("browseBtn");
  const addFileBtn = document.getElementById("addFileBtn");
  const addPanel = document.getElementById("addPanel");
  const editBtn = document.getElementById("editBtn");
  const saveEditBtn = document.getElementById("saveEditBtn");
  const cancelEditBtn = document.getElementById("cancelEditBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const resetDocBtn = document.getElementById("resetDocBtn");
  const expandAllBtn = document.getElementById("expandAllBtn");
  const collapseAllBtn = document.getElementById("collapseAllBtn");
  const pasteToggle = document.getElementById("pasteToggle");
  const pastePanel = document.getElementById("pastePanel");
  const pasteArea = document.getElementById("pasteArea");
  const pasteNameInput = document.getElementById("pasteNameInput");
  const pasteRenderBtn = document.getElementById("pasteRenderBtn");
  const themeToggle = document.getElementById("themeToggle");
  const themeIcon = document.getElementById("themeIcon");

  /* ---------- Multi-file state (persisted in this browser via localStorage) ---------- */
  const STORAGE_KEY = "outline-viewer-docs-v1";
  let docs = loadDocs();
  let currentIndex = 0;
  let editing = false;

  function loadDocs() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (Array.isArray(parsed) && parsed.length) return parsed;
    } catch (e) {}
    return DEFAULT_DOCS.map((d) => ({ ...d }));
  }

  function persistDocs() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(docs)); } catch (e) {}
  }

  function renderDocument(text, name) {
    uid = 0;
    const tree = parseMarkdown(text);
    let title = name ? name.replace(/\.(md|markdown|txt)$/i, "") : "Untitled note";
    let bodyChildren = tree.children;
    // If the note starts with an H1, use it as the page title instead of showing it twice,
    // promoting its own children back up to the top level.
    const first = tree.children[0];
    if (first && first.type === "heading" && first.level === 1) {
      title = first.text;
      bodyChildren = first.children.concat(tree.children.slice(1));
    }
    outlineEl.innerHTML = `<h1 class="doc-title">${escapeHtml(title)}</h1>` + renderChildren(bodyChildren);
  }

  function renderTabs() {
    fileTabs.innerHTML = docs
      .map((d, i) => {
        const closeBtn = docs.length > 1
          ? `<span class="tab-close" data-close="${i}" title="Remove this file">✕</span>`
          : "";
        return `<button class="file-tab${i === currentIndex ? " active" : ""}" data-index="${i}">${escapeHtml(d.name)}${closeBtn}</button>`;
      })
      .join("");
  }

  function render() {
    renderTabs();
    if (editing) {
      outlineWrap.classList.add("hidden");
      editorWrap.classList.remove("hidden");
      editBtn.classList.add("hidden");
      expandAllBtn.classList.add("hidden");
      collapseAllBtn.classList.add("hidden");
      editorNameInput.value = docs[currentIndex].name;
      editorArea.value = docs[currentIndex].content;
    } else {
      editorWrap.classList.add("hidden");
      outlineWrap.classList.remove("hidden");
      editBtn.classList.remove("hidden");
      expandAllBtn.classList.remove("hidden");
      collapseAllBtn.classList.remove("hidden");
      renderDocument(docs[currentIndex].content, docs[currentIndex].name);
    }
  }

  function switchTo(i) {
    currentIndex = i;
    editing = false;
    render();
  }

  function addDoc(name, content) {
    const finalName = name && name.trim() ? name.trim() : `Untitled ${docs.length + 1}.md`;
    docs.push({ name: finalName, content });
    currentIndex = docs.length - 1;
    editing = false;
    persistDocs();
    render();
    addPanel.classList.add("hidden");
    pastePanel.classList.add("hidden");
  }

  function removeDoc(i) {
    if (docs.length <= 1) return;
    if (!confirm(`Remove "${docs[i].name}"? This can't be undone.`)) return;
    docs.splice(i, 1);
    if (currentIndex >= docs.length) currentIndex = docs.length - 1;
    else if (currentIndex > i) currentIndex--;
    editing = false;
    persistDocs();
    render();
  }

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => addDoc(file.name, e.target.result);
    reader.readAsText(file);
  }

  /* ---------- Tabs ---------- */
  fileTabs.addEventListener("click", (e) => {
    const closeEl = e.target.closest("[data-close]");
    if (closeEl) {
      e.stopPropagation();
      removeDoc(+closeEl.getAttribute("data-close"));
      return;
    }
    const tabEl = e.target.closest(".file-tab");
    if (tabEl) switchTo(+tabEl.getAttribute("data-index"));
  });

  /* ---------- Add file ---------- */
  addFileBtn.addEventListener("click", () => addPanel.classList.toggle("hidden"));
  browseBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => {
    if (e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
    fileInput.value = "";
  });
  pasteToggle.addEventListener("click", () => pastePanel.classList.toggle("hidden"));
  pasteRenderBtn.addEventListener("click", () => {
    if (pasteArea.value.trim()) {
      addDoc(pasteNameInput.value, pasteArea.value);
      pasteArea.value = "";
      pasteNameInput.value = "";
    }
  });

  /* ---------- Edit / save / download / reset ---------- */
  editBtn.addEventListener("click", () => {
    editing = true;
    render();
  });
  cancelEditBtn.addEventListener("click", () => {
    editing = false;
    render();
  });
  saveEditBtn.addEventListener("click", () => {
    const newName = editorNameInput.value.trim() || docs[currentIndex].name;
    docs[currentIndex] = { name: newName, content: editorArea.value };
    editing = false;
    persistDocs();
    render();
  });
  downloadBtn.addEventListener("click", () => {
    const blob = new Blob([editorArea.value], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = editorNameInput.value.trim() || docs[currentIndex].name || "note.md";
    a.click();
    URL.revokeObjectURL(url);
  });
  resetDocBtn.addEventListener("click", () => {
    const original = DEFAULT_DOCS.find((d) => d.name === docs[currentIndex].name);
    if (!original) {
      alert("This file has no built-in original to reset to — it was added, not one of the defaults.");
      return;
    }
    if (!confirm("Discard your edits in the box below and restore the original content? (Click Save afterward to keep it.)")) return;
    editorArea.value = original.content;
  });

  /* ---------- Expand / collapse ---------- */
  expandAllBtn.addEventListener("click", () => {
    outlineEl.querySelectorAll(".collapsed").forEach((el) => el.classList.remove("collapsed"));
  });
  collapseAllBtn.addEventListener("click", () => {
    outlineEl.querySelectorAll(".h-section, .list-item, .callout").forEach((el) => {
      if (el.querySelector(":scope > .fold-row:not(.no-toggle)")) el.classList.add("collapsed");
    });
  });

  // Always open straight to the first file.
  render();

  const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
  const sunIcon = `<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>`;
  themeToggle.addEventListener("click", () => {
    const isDark = document.body.getAttribute("data-theme") === "dark";
    document.body.setAttribute("data-theme", isDark ? "light" : "dark");
    themeIcon.innerHTML = isDark ? sunIcon : moonIcon;
  });
})();
</script>
</body>
</html>
